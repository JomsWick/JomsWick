name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *" # twice a day
  workflow_dispatch: # manual "Run workflow" button
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0D9488&color_dots=#E6FFFA,#99F6E4,#2DD4BF,#0D9488,#134E4A
            dist/github-snake-dark.svg?color_snake=#5EEAD4&color_dots=#161C24,#134E4A,#0D9488,#2DD4BF,#5EEAD4

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
