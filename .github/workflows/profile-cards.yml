name: Profile Cards

# NOTE: no "push" trigger on purpose. This workflow commits back to main
# using your PAT, and a PAT-authored commit re-triggers workflows — a push
# trigger here would loop forever.
on:
  schedule:
    - cron: "0 2 * * *"     # daily at 02:00 UTC (10:00 PHT)
  workflow_dispatch:         # manual "Run workflow" button

jobs:
  build:
    name: generate-github-profile-summary-cards
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Fail early if the token secret is missing
        run: |
          if [ -z "${{ secrets.SUMMARY_GITHUB_TOKEN }}" ]; then
            echo "::error::SUMMARY_GITHUB_TOKEN is empty. Create it under"
            echo "::error::Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Token secret is present."

      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 8        # Philippines (UTC+8) — makes productive-time accurate
          EXCLUDE: ""
          AUTO_PUSH: true